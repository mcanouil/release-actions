name: Release
description: Create the GitHub release of a version with a composed body, and move the rolling tags on request.

inputs:
  version:
    description: "The version to release, usually the version output of bump."
    required: true
  tag-prefix:
    description: "The tag is <tag-prefix><version>."
    required: false
    default: ""
  body-file:
    description: "The release body, usually the body-file output of notes."
    required: true
  title:
    description: "Title of the release. Placeholders: {tag}, {version}, {date}, and {count}, which is ' (N)' for the CalVer release YYYY.MM.DD-N and empty otherwise."
    required: false
    default: "{tag}"
  date:
    description: "Value of {date}, YYYY-MM-DD. Default: today in UTC."
    required: false
    default: ""
  target:
    description: "Commit to tag. Default: github.sha."
    required: false
    default: ""
  assets:
    description: "Globs of the files to attach, one per line, each with an optional #label."
    required: false
    default: ""
  draft:
    description: "Create a draft release."
    required: false
    default: "false"
  prerelease:
    description: "Mark the release as a prerelease."
    required: false
    default: "false"
  latest:
    description: "Mark the release as the latest: auto, true or false."
    required: false
    default: "auto"
  rolling:
    description: "Move <tag-prefix>X and <tag-prefix>X.Y to the target commit."
    required: false
    default: "false"
  token:
    description: "Token with contents: write."
    required: false
    default: ${{ github.token }}

outputs:
  tag:
    description: "Tag of the release."
    value: ${{ steps.release.outputs.tag }}
  url:
    description: "URL of the release."
    value: ${{ steps.release.outputs.url }}
  release-id:
    description: "Numeric identifier of the release."
    value: ${{ steps.release.outputs.release-id }}

runs:
  using: composite
  steps:
    - name: Create the release
      id: release
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        BODY_FILE: ${{ inputs.body-file }}
        TITLE: ${{ inputs.title }}
        RELEASE_DATE: ${{ inputs.date }}
        TARGET: ${{ inputs.target }}
        ASSETS: ${{ inputs.assets }}
        DRAFT: ${{ inputs.draft }}
        PRERELEASE: ${{ inputs.prerelease }}
        LATEST: ${{ inputs.latest }}
        ROLLING: ${{ inputs.rolling }}
        GH_TOKEN: ${{ inputs.token }}
      run: '"${GITHUB_ACTION_PATH}/release.sh"'
