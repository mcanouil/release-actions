name: Bump version
description: Write the next version to target files and roll the Unreleased section of the changelog.

inputs:
  bump:
    description: "patch, minor, major, calver, dev, or an explicit version such as 1.2.3. dev needs the r preset."
    required: true
  ecosystems:
    description: "Comma-separated presets whose targets come before targets: citation, npm, cargo, typst, quarto-extension or r. r also switches to R package versions and NEWS.md."
    required: false
    default: ""
  targets:
    description: "YAML list of {file, pattern, source?, required?}. Patterns use {version}, {date} and {major}; a leading ^ and a trailing $ anchor them to a line."
    required: false
    default: ""
  version-source:
    description: "Where the current version comes from: target or tag."
    required: false
    default: "target"
  tag-prefix:
    description: "Prefix of the version tags, such as v. Give the same value to release."
    required: false
    default: ""
  changelog:
    description: "Path of the changelog. An empty string turns off the changelog roll. With the r preset, the default becomes NEWS.md."
    required: false
    default: "CHANGELOG.md"
  changelog-heading:
    description: "Heading that the Unreleased section becomes."
    required: false
    default: "## {version} ({date})"
  allow-empty:
    description: "Release even when the Unreleased section is empty."
    required: false
    default: "false"
  after-bump:
    description: "Bash command run after the version is written, with VERSION, DATE and MAJOR set, such as a lock file update. The files it changes join the files output."
    required: false
    default: ""
  date:
    description: "Release date, YYYY-MM-DD. Default: today in UTC."
    required: false
    default: ""
  token:
    description: "Token for the GitHub API. Only a token with contents: write sees draft releases."
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: "The new version, without a tag prefix."
    value: ${{ steps.bump.outputs.version }}
  previous:
    description: "The version before the bump."
    value: ${{ steps.bump.outputs.previous }}
  major:
    description: "The major part of the new version."
    value: ${{ steps.bump.outputs.major }}
  minor:
    description: "The major and minor parts of the new version, such as 1.5."
    value: ${{ steps.bump.outputs.minor }}
  date:
    description: "The release date."
    value: ${{ steps.bump.outputs.date }}
  notes-file:
    description: "Path of a file that holds the changelog section of the release."
    value: ${{ steps.bump.outputs.notes-file }}
  files:
    description: "Changed files, one per line."
    value: ${{ steps.bump.outputs.files }}

runs:
  using: composite
  steps:
    - name: Bump the version
      id: bump
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        ECOSYSTEMS: ${{ inputs.ecosystems }}
        TARGETS: ${{ inputs.targets }}
        VERSION_SOURCE: ${{ inputs.version-source }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        CHANGELOG: ${{ inputs.changelog }}
        CHANGELOG_HEADING: ${{ inputs.changelog-heading }}
        ALLOW_EMPTY: ${{ inputs.allow-empty }}
        AFTER_BUMP: ${{ inputs.after-bump }}
        RELEASE_DATE: ${{ inputs.date }}
        GH_TOKEN: ${{ inputs.token }}
      run: '"${GITHUB_ACTION_PATH}/bump.sh"'
